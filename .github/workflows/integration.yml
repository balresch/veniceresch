name: Integration smoke

# Live smoke tests that hit the real Venice API. NOT part of the PR gate —
# they run only on manual dispatch or the weekly schedule, and only when the
# VENICE_API_KEY secret is configured. This catches upstream Venice drift
# (auth changes, content-type surprises, renamed fields) that the mocked unit
# suite cannot see. Keep it tiny: see tests/integration/test_live.py.

on:
  workflow_dispatch:
    inputs:
      paid:
        description: "Also run paid tests (billed per job, e.g. voice-changer round trip)"
        type: boolean
        default: false
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  smoke:
    name: live smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require the API key secret
        # Without the key every test skips and the run reports green — which
        # silently hid that this smoke never ran. Fail loudly instead.
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
        run: |
          if [ -z "$VENICE_API_KEY" ]; then
            echo "::error::VENICE_API_KEY secret is not set; the live smoke would skip every test. Add it with: gh secret set VENICE_API_KEY"
            exit 1
          fi
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run integration smoke
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          # Optional: admin-only (billing) tests skip when this secret is absent.
          VENICE_ADMIN_API_KEY: ${{ secrets.VENICE_ADMIN_API_KEY }}
          # Scheduled runs have no inputs, so this stays empty (paid tier skipped).
          VENICE_INTEGRATION_PAID: ${{ inputs.paid && '1' || '' }}
        run: pytest tests/integration -m integration -q
